<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Beer mug">
  <rect width="64" height="64" rx="12" fill="#2e1d0f"/>

  <!-- handle -->
  <path d="M38 27h5a7 7 0 0 1 7 7v4a7 7 0 0 1-7 7h-5"
        fill="none" stroke="#c9922f" stroke-width="4.5" stroke-linecap="round"/>

  <!-- mug body -->
  <path d="M15 19h23v37a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3z" fill="#e8a93c"/>

  <!-- highlight down the left side -->
  <path d="M15 19h6v40h-3a3 3 0 0 1-3-3z" fill="#f2c866"/>

  <!-- stein facet lines -->
  <g stroke="#c9871f" stroke-width="1.6" stroke-linecap="round" opacity=".75">
    <path d="M26 23v32"/>
    <path d="M32 23v32"/>
  </g>

  <!-- foam head -->
  <path d="M17 19a5.5 5.5 0 0 1 3.6-8.2 6.4 6.4 0 0 1 11.4-3 5.9 5.9 0 0 1 8 4.5A5.5 5.5 0 0 1 36 19z"
        fill="#f9f0dc"/>

  <!-- body outline -->
  <path d="M15 19h23v37a3 3 0 0 1-3 3H18a3 3 0 0 1-3-3z"
        fill="none" stroke="#7a4f1c" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
